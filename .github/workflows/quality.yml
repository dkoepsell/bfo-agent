# SPEC-bfo-agent-quality.md QS-G4: construction-gate audit on a fixture
# ontology plus the gate-recall benchmark at a fixed seed.
name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4  # HermiT (owlready2) needs a JVM
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Download BFO 2020
        run: python scripts/download_bfo.py
      - name: Audit and profile tests
        run: python -m pytest -q tests/test_ontology_audit.py tests/test_profiles.py
      - name: Construction gates and gate recall
        run: python scripts/ci_quality.py --seed 7 --min-recall 0.75
