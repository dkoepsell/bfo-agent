<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BFO-Agent</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1d2230;
    --text: #e8ecf1;
    --muted: #8a93a6;
    --accent: #7dd3fc;
    --good: #86efac;
    --bad: #fca5a5;
    --warn: #fcd34d;
    --border: #2a2f3d;
    --font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  header .stats { font-family: var(--font); font-size: 12px; color: var(--muted); }
  .app { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 45px); }
  .pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
  .pane:last-child { border-right: 0; }
  .pane-header {
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); background: var(--panel);
  }
  .pane-body { flex: 1; overflow-y: auto; padding: 12px 16px; }

  .msg { margin-bottom: 14px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .msg.user .bubble { background: var(--panel-2); border: 1px solid var(--border); }
  .msg.agent .bubble { background: transparent; border: 1px dashed var(--border); }
  .bubble { padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; line-height: 1.5; }

  .input-row {
    display: flex; gap: 8px; padding: 10px 16px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  .input-row textarea {
    flex: 1; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font: inherit; resize: none; min-height: 44px;
  }
  .input-row textarea:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent); color: #0a1220; border: 0;
    padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: #7f1d1d; color: #fecaca; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .proposal { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 14px; }
  .verdict { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-family: var(--font); }
  .verdict.consistent { background: rgba(134,239,172,0.12); color: var(--good); }
  .verdict.inconsistent { background: rgba(252,165,165,0.12); color: var(--bad); }
  .verdict.error { background: rgba(252,211,77,0.12); color: var(--warn); }
  .verdict.pending { background: rgba(138,147,166,0.12); color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-family: var(--font); font-size: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  code { font-family: var(--font); background: var(--panel); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  .iri { color: var(--accent); word-break: break-all; }
  .bfo { color: var(--warn); }
  .rationale { color: var(--muted); font-style: italic; margin-top: 2px; }

  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; padding: 8px 16px 0; background: var(--panel); flex-wrap: wrap; }
  .tab { padding: 6px 12px; font-size: 12px; color: var(--muted); cursor: pointer; border: 1px solid transparent; border-bottom: 0; border-radius: 4px 4px 0 0; }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--border); }
  details { margin-top: 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .muted { color: var(--muted); font-size: 12px; }

  /* Extract tab specifics */
  .section-head {
    margin: 14px 0 6px 0; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .extract-config {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px; margin-bottom: 10px;
  }
  .extract-config label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
  .extract-config input, .extract-config select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 8px; font: inherit;
  }
  #extract-text {
    width: 100%; min-height: 140px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-family: var(--font); font-size: 12px; resize: vertical;
  }
  .claim-row {
    display: grid; grid-template-columns: 24px 60px 1fr; gap: 8px;
    padding: 8px; border-bottom: 1px solid var(--border);
    align-items: start;
  }
  .claim-row.accepted { background: rgba(134,239,172,0.04); }
  .claim-row.rejected { background: rgba(252,165,165,0.06); opacity: 0.55; }
  .claim-row.inconsistent { background: rgba(252,211,77,0.05); }
  .claim-row input[type=checkbox] { margin-top: 4px; }
  .conf { font-family: var(--font); font-size: 11px; padding: 2px 6px; border-radius: 3px; text-align: center; }
  .conf.high { background: rgba(134,239,172,0.15); color: var(--good); }
  .conf.medium { background: rgba(252,211,77,0.15); color: var(--warn); }
  .conf.low { background: rgba(138,147,166,0.15); color: var(--muted); }
  .claim-text { font-size: 13px; margin-bottom: 3px; }
  .claim-source { color: var(--muted); font-size: 11px; font-style: italic; }
  .claim-status { font-family: var(--font); font-size: 11px; margin-top: 4px; }
  .progress {
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 8px 10px; border-radius: 4px; font-family: var(--font); font-size: 12px;
    margin: 8px 0;
  }
  .bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width 0.2s; }
  .row-flex { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>BFO-Agent</h1>
  <div class="stats" id="stats">connecting...</div>
</header>

<div class="app">
  <!-- CHAT PANE -->
  <section class="pane">
    <div class="pane-header">Dialogue</div>
    <div class="pane-body" id="chat"></div>
    <div class="input-row">
      <textarea id="utterance" placeholder="Type a statement or question. Shift+Enter for newline."></textarea>
      <div style="display:flex; flex-direction:column; gap:4px;">
        <button id="btn-propose">Propose</button>
        <button id="btn-query" class="secondary">Query</button>
      </div>
    </div>
  </section>

  <!-- RIGHT PANE: tabs -->
  <section class="pane">
    <div class="tabs">
      <div class="tab active" data-tab="proposal">Proposal Review</div>
      <div class="tab" data-tab="extract">Extract</div>
      <div class="tab" data-tab="graph">Graph</div>
      <div class="tab" data-tab="log">Session Log</div>
    </div>
    <div class="pane-body" id="right-body">
      <div id="tab-proposal" class="tab-pane">
        <div class="muted">Submit an utterance. The proposer will return a typed proposal here for your review. Nothing commits until you accept.</div>
      </div>

      <div id="tab-extract" class="tab-pane" style="display:none;">
        <div class="section-head">Job</div>
        <div class="row-flex" style="margin-bottom:8px; flex-wrap:wrap;">
          <select id="job-select" style="flex:1; min-width:200px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:6px 8px; font:inherit;">
            <option value="">(select job or create new)</option>
          </select>
          <button class="secondary" id="btn-job-refresh" title="Refresh job list">↻</button>
          <button class="secondary" id="btn-job-new">New job...</button>
          <button class="danger" id="btn-job-delete" disabled>Delete</button>
        </div>
        <div id="job-summary" class="muted" style="margin-bottom:12px;"></div>

        <div class="section-head">1. Add source text</div>
        <div class="row-flex" style="margin-bottom:8px;">
          <input type="file" id="extract-file" accept=".txt,.md" />
          <button class="secondary" id="btn-clear-text">Clear</button>
        </div>
        <textarea id="extract-text" placeholder="Paste a chapter, or upload a .txt / .md file. You can run this multiple times on one job to add more chapters."></textarea>

        <div class="extract-config" style="margin-top:10px;">
          <label>Section label
            <input type="text" id="extract-section" placeholder="e.g. SOoL Ch.4 Legal Reality" />
          </label>
          <label>Min confidence
            <select id="extract-min-conf">
              <option value="low">low (most inclusive)</option>
              <option value="medium" selected>medium</option>
              <option value="high">high (only strong claims)</option>
            </select>
          </label>
          <label>Chunk chars
            <input type="number" id="extract-chunk-chars" value="8000" min="1000" max="40000" step="500" />
          </label>
          <label>Overlap
            <input type="number" id="extract-overlap" value="400" min="0" max="2000" step="50" />
          </label>
        </div>

        <div class="row-flex" style="margin-top:8px;">
          <button id="btn-extract" disabled>Extract &amp; append</button>
          <span class="muted" id="extract-status"></span>
        </div>

        <div id="extract-progress"></div>

        <div class="section-head">2. Review &amp; feed</div>
        <div class="row-flex" style="margin-bottom:8px;">
          <button class="secondary" id="btn-select-high" disabled>Select high</button>
          <button class="secondary" id="btn-select-high-med" disabled>Select high+medium</button>
          <button class="secondary" id="btn-select-none" disabled>Clear selection</button>
          <span class="muted" id="selection-count"></span>
        </div>
        <div class="row-flex">
          <button id="btn-feed" disabled>Feed selected</button>
          <button class="secondary" id="btn-pause" disabled>Pause</button>
          <button class="secondary" id="btn-resume" disabled>Resume</button>
          <label class="muted row-flex" style="gap:6px;">
            <input type="checkbox" id="feed-auto-accept" checked />
            auto-accept when reasoner says consistent
          </label>
        </div>
        <div id="feed-progress"></div>

        <div id="extract-claims"></div>
      </div>

      <div id="tab-graph" class="tab-pane" style="display:none;">
        <div class="muted">Loading graph...</div>
      </div>

      <div id="tab-log" class="tab-pane" style="display:none;">
        <div class="muted">Session events will appear here.</div>
      </div>
    </div>
  </section>
</div>

<script>
const API = "http://localhost:5000";
const SESSION_ID = "sess_" + Math.random().toString(16).slice(2, 14);

let currentProposal = null;

// ---------- utility ----------
function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmt(obj) { return esc(JSON.stringify(obj, null, 2)); }

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// ---------- chat ----------
function addMsg(who, text) {
  const chat = document.getElementById("chat");
  chat.appendChild(el(`
    <div class="msg ${who}">
      <div class="who">${who === "user" ? "you" : "agent"}</div>
      <div class="bubble">${esc(text)}</div>
    </div>
  `));
  chat.scrollTop = chat.scrollHeight;
}

// ---------- propose flow ----------
async function propose() {
  const ta = document.getElementById("utterance");
  const text = ta.value.trim();
  if (!text) return;
  ta.value = "";
  addMsg("user", text);
  setBusy(true);
  try {
    const proposal = await api("/propose", {
      method: "POST",
      body: JSON.stringify({ utterance: text, session_id: SESSION_ID }),
    });
    currentProposal = proposal;
    renderProposal(proposal);
    switchTab("proposal");
  } catch (e) {
    addMsg("agent", "Proposer error: " + e.message);
  } finally {
    setBusy(false);
  }
}

function renderProposal(p) {
  const verdict = p.reasoner_verdict || "unknown";
  const verdictClass = verdict === "consistent" ? "consistent" : verdict === "inconsistent" ? "inconsistent" : "error";

  const entRows = (p.entities || []).map(e => `
    <tr>
      <td><code class="iri">${esc(e.iri_suggestion)}</code></td>
      <td>${esc(e.label)}</td>
      <td><code class="bfo">${esc(e.bfo_type)}</code><br/><span class="muted">${esc(e.bfo_label)}</span></td>
      <td>${esc(e.kind)}</td>
      <td class="rationale">${esc(e.rationale)}</td>
    </tr>`).join("");

  const relRows = (p.relations || []).map(r => `
    <tr>
      <td><code class="iri">${esc(r.s)}</code></td>
      <td><code class="bfo">${esc(r.p)}</code></td>
      <td><code class="iri">${esc(r.o)}</code></td>
      <td class="rationale">${esc(r.rationale)}</td>
    </tr>`).join("");

  const questions = (p.open_questions || []).map(q => `<li>${esc(q)}</li>`).join("");

  const html = `
    <div class="proposal">
      <div><strong>Utterance:</strong> <em>${esc(p.utterance)}</em></div>
      <div style="margin-top:6px;">
        <span class="verdict ${verdictClass}">reasoner: ${esc(verdict)}</span>
        <span class="muted" style="margin-left:8px;">proposal ${esc(p.proposal_id)}</span>
      </div>
      ${p.rationale_summary ? `<div class="rationale" style="margin-top:8px;">${esc(p.rationale_summary)}</div>` : ""}
      ${entRows ? `
        <h4 class="section-head">Entities</h4>
        <table><thead><tr><th>IRI</th><th>Label</th><th>BFO Type</th><th>Kind</th><th>Rationale</th></tr></thead><tbody>${entRows}</tbody></table>
      ` : ""}
      ${relRows ? `
        <h4 class="section-head">Relations</h4>
        <table><thead><tr><th>Subject</th><th>Predicate</th><th>Object</th><th>Rationale</th></tr></thead><tbody>${relRows}</tbody></table>
      ` : ""}
      ${questions ? `<h4 class="section-head">Open Questions</h4><ul>${questions}</ul>` : ""}
      ${p.reasoner_detail ? `<details><summary>reasoner detail</summary><pre class="muted" style="white-space:pre-wrap;">${esc(p.reasoner_detail)}</pre></details>` : ""}
      <div class="actions">
        <button id="btn-accept" ${verdict === "inconsistent" ? "disabled" : ""}>Accept and commit</button>
        <button class="secondary" id="btn-edit">Edit JSON</button>
        <button class="danger" id="btn-reject">Reject</button>
      </div>
    </div>`;

  const container = document.getElementById("tab-proposal");
  container.innerHTML = html;
  document.getElementById("btn-accept").onclick = () => commit("accept");
  document.getElementById("btn-reject").onclick = () => commit("reject");
  document.getElementById("btn-edit").onclick = editJson;
}

async function commit(decision) {
  if (!currentProposal) return;
  setBusy(true);
  try {
    const result = await api("/commit", {
      method: "POST",
      body: JSON.stringify({
        proposal_id: currentProposal.proposal_id,
        session_id: SESSION_ID,
        proposal: currentProposal,
        user_decision: decision,
      }),
    });
    if (decision === "reject") {
      addMsg("agent", "Rejected. No changes written.");
    } else {
      const warns = (result.warnings || []).filter(Boolean);
      addMsg("agent", "Committed." + (warns.length ? " Warnings: " + warns.join("; ") : ""));
    }

    currentProposal = null;
    document.getElementById("tab-proposal").innerHTML = `<div class="muted">Submit another utterance.</div>`;
    refreshGraph();
  } catch (e) {
    addMsg("agent", "Commit error: " + e.message);
  } finally {
    setBusy(false);
  }
}

function editJson() {
  if (!currentProposal) return;
  const json = prompt("Edit proposal JSON (advanced):", JSON.stringify(currentProposal, null, 2));
  if (!json) return;
  try {
    currentProposal = JSON.parse(json);
    renderProposal(currentProposal);
  } catch (e) {
    alert("Invalid JSON: " + e.message);
  }
}

// ---------- query flow ----------
async function query() {
  const ta = document.getElementById("utterance");
  const text = ta.value.trim();
  if (!text) return;
  ta.value = "";
  addMsg("user", "[query] " + text);
  setBusy(true);
  try {
    const r = await api("/query", {
      method: "POST",
      body: JSON.stringify({ question: text, session_id: SESSION_ID }),
    });
    const tag = r.grounded ? "[grounded]" : "[ungrounded]";
    addMsg("agent", tag + " " + r.answer + (r.missing_iris.length ? "\n\nMissing IRIs: " + r.missing_iris.join(", ") : ""));
  } catch (e) {
    addMsg("agent", "Query error: " + e.message);
  } finally {
    setBusy(false);
  }
}

// ---------- EXTRACT tab (job-based) ----------
let currentJob = null;          // full job object, reloaded on any mutation
let feedingLoop = false;        // true while feed loop is running
let feedCancel = false;         // set true to interrupt loop between claims

function extractStatus(msg) {
  document.getElementById("extract-status").textContent = msg || "";
}

async function refreshJobList(selectJobId = null) {
  const jobs = await api("/jobs");
  const sel = document.getElementById("job-select");
  const keepId = selectJobId || (currentJob && currentJob.job_id) || sel.value;
  sel.innerHTML = `<option value="">(select job or create new)</option>` +
    jobs.map(j => {
      const c = j.counts;
      const label = `${j.name} · ${c.committed}/${c.approved} done (${j.status})`;
      return `<option value="${esc(j.job_id)}">${esc(label)}</option>`;
    }).join("");
  if (keepId && jobs.find(j => j.job_id === keepId)) {
    sel.value = keepId;
    await loadJob(keepId);
  } else {
    clearJobUI();
  }
}

async function loadJob(jobId) {
  if (!jobId) { clearJobUI(); return; }
  try {
    currentJob = await api(`/jobs/${jobId}`);
    renderJobSummary();
    renderClaims();
    setJobControlsEnabled(true);
  } catch (e) {
    extractStatus("load failed: " + e.message);
    clearJobUI();
  }
}

function clearJobUI() {
  currentJob = null;
  document.getElementById("job-summary").textContent = "";
  document.getElementById("extract-claims").innerHTML = "";
  document.getElementById("feed-progress").innerHTML = "";
  setJobControlsEnabled(false);
}

function setJobControlsEnabled(enabled) {
  const has = !!currentJob;
  document.getElementById("btn-extract").disabled = !has;
  document.getElementById("btn-job-delete").disabled = !has;
  document.getElementById("btn-select-high").disabled = !has;
  document.getElementById("btn-select-high-med").disabled = !has;
  document.getElementById("btn-select-none").disabled = !has;
  document.getElementById("btn-feed").disabled = !has || feedingLoop;
  document.getElementById("btn-pause").disabled = !has || !feedingLoop;
  document.getElementById("btn-resume").disabled = !has;
}

function renderJobSummary() {
  if (!currentJob) return;
  const claims = currentJob.claims || [];
  const counts = {
    total: claims.length,
    approved: claims.filter(c => c.approved).length,
    pending: claims.filter(c => c.status === "pending" && c.approved).length,
    committed: claims.filter(c => c.status === "committed").length,
    inconsistent: claims.filter(c => c.status === "inconsistent").length,
    needs_review: claims.filter(c => c.status === "needs_review").length,
    error: claims.filter(c => c.status === "error").length,
  };
  const pct = counts.approved ? Math.round(100 * counts.committed / counts.approved) : 0;
  document.getElementById("job-summary").innerHTML = `
    <code>${esc(currentJob.job_id)}</code> &middot;
    status <span class="verdict ${currentJob.status === 'paused' ? 'error' : 'pending'}">${esc(currentJob.status)}</span> &middot;
    session <code>${esc(currentJob.session_id)}</code><br/>
    <strong>${counts.total}</strong> claims total,
    <strong>${counts.approved}</strong> approved,
    <strong>${counts.committed}</strong> committed,
    <strong>${counts.inconsistent}</strong> inconsistent,
    <strong>${counts.needs_review}</strong> to review,
    <strong>${counts.error}</strong> errors,
    <strong>${counts.pending}</strong> pending (${pct}% of approved)
  `;
}

async function createJob() {
  const name = prompt("Job name (e.g. 'SOoL Ch.4' or 'SOoL full book'):");
  if (!name || !name.trim()) return;
  try {
    const job = await api("/jobs", {
      method: "POST",
      body: JSON.stringify({ name: name.trim() }),
    });
    await refreshJobList(job.job_id);
  } catch (e) {
    alert("create failed: " + e.message);
  }
}

async function deleteCurrentJob() {
  if (!currentJob) return;
  if (!confirm(`Delete job '${currentJob.name}' and its claim queue?\n\nThis does NOT delete anything already committed to the ontology or sessions log.`)) return;
  try {
    await api(`/jobs/${currentJob.job_id}`, { method: "DELETE" });
    await refreshJobList();
  } catch (e) {
    alert("delete failed: " + e.message);
  }
}

async function runExtractionIntoJob() {
  if (!currentJob) { alert("Select or create a job first."); return; }
  const text = document.getElementById("extract-text").value.trim();
  if (!text) { alert("Paste or upload text first."); return; }
  const section = document.getElementById("extract-section").value.trim() || "unknown";
  const minConf = document.getElementById("extract-min-conf").value;
  const chunkChars = parseInt(document.getElementById("extract-chunk-chars").value, 10);
  const overlap = parseInt(document.getElementById("extract-overlap").value, 10);

  const confRank = { low: 0, medium: 1, high: 2 };
  const minRank = confRank[minConf];

  setBusy(true);
  extractStatus("preparing chunks...");
  try {
    const prep = await api("/extract/prepare", {
      method: "POST",
      body: JSON.stringify({ text, section, chunk_chars: chunkChars, overlap }),
    });
    const chunks = prep.chunks;
    renderExtractProgress(0, chunks.length);
    extractStatus(`${chunks.length} chunks, extracting...`);

    let collected = 0;
    for (let i = 0; i < chunks.length; i++) {
      try {
        const r = await api("/extract/chunk", {
          method: "POST",
          body: JSON.stringify({ chunk: chunks[i], section, chunk_index: i }),
        });
        const kept = (r.claims || []).filter(c => {
          const rank = confRank[(c.confidence || "low").toLowerCase()] ?? 0;
          return rank >= minRank;
        });
        if (kept.length) {
          // Persist to the job immediately; browser crash won't lose these
          await api(`/jobs/${currentJob.job_id}/append_claims`, {
            method: "POST",
            body: JSON.stringify({ claims: kept }),
          });
          collected += kept.length;
          await loadJob(currentJob.job_id);  // refresh view
        }
      } catch (e) {
        console.error(`chunk ${i} failed:`, e);
      }
      renderExtractProgress(i + 1, chunks.length);
    }

    extractStatus(`done. ${collected} new claims appended at >= ${minConf}.`);
  } catch (e) {
    extractStatus("extraction error: " + e.message);
  } finally {
    setBusy(false);
  }
}

function renderExtractProgress(done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("extract-progress").innerHTML = `
    <div class="progress">
      chunk ${done}/${total}
      <div class="bar"><div style="width:${pct}%"></div></div>
    </div>`;
}

function renderClaims() {
  const container = document.getElementById("extract-claims");
  if (!currentJob || !currentJob.claims.length) {
    container.innerHTML = `<div class="muted">No claims yet. Paste text above and click Extract.</div>`;
    return;
  }
  const claims = currentJob.claims;
  container.innerHTML = `<div class="section-head">Claims (${claims.length})</div>`;
  claims.forEach((c) => {
    const status = c.status || "pending";
    const cls = status === "committed" ? "accepted"
              : status === "rejected" ? "rejected"
              : status === "inconsistent" ? "inconsistent" : "";
    const verdictCls = status === "committed" ? "consistent"
                     : status === "inconsistent" ? "inconsistent"
                     : status === "error" ? "error" : "pending";
    const reviewBtn = (status === "needs_review" || status === "inconsistent") && c.proposal_id
      ? ` <button class="secondary" data-review-pid="${esc(c.proposal_id)}" style="padding:2px 8px; font-size:11px; margin-left:6px;">review →</button>`
      : "";
    const statusLabel = status === "pending" ? "" :
      `<div class="claim-status"><span class="verdict ${verdictCls}">${esc(status)}</span>${c.proposal_id ? ` <span class="muted">${esc(c.proposal_id)}</span>` : ""}${reviewBtn}</div>`;
    const row = el(`
      <div class="claim-row ${cls}" data-cid="${c.id}">
        <input type="checkbox" ${c.approved ? "checked" : ""} ${status !== "pending" ? "disabled" : ""} />
        <div class="conf ${esc(c.confidence)}">${esc(c.confidence)}</div>
        <div>
          <div class="claim-text">${esc(c.claim)}</div>
          <div class="claim-source">${esc(c.source_quote)}</div>
          ${c.note ? `<div class="muted" style="margin-top:2px;">${esc(c.note)}</div>` : ""}
          ${c.section ? `<div class="muted" style="font-size:10px; margin-top:2px;">${esc(c.section)}</div>` : ""}
          ${statusLabel}
        </div>
      </div>
    `);
    const cb = row.querySelector("input[type=checkbox]");
    if (cb && !cb.disabled) {
      cb.addEventListener("change", async (ev) => {
        const approvals = {};
        approvals[c.id] = ev.target.checked;
        try {
          await api(`/jobs/${currentJob.job_id}/approve`, {
            method: "POST",
            body: JSON.stringify({ approvals }),
          });
          // Update local copy without full reload
          c.approved = ev.target.checked;
          updateSelectionCount();
          renderJobSummary();
        } catch (e) {
          alert("approve failed: " + e.message);
          ev.target.checked = !ev.target.checked;
        }
      });
    }
    const rb = row.querySelector("button[data-review-pid]");
    if (rb) {
      rb.addEventListener("click", () => alert("Review flow: this claim was proposed but not committed. Re-propose it manually via the Dialogue tab to inspect again, or accept via the session log."));
    }
    container.appendChild(row);
  });
  updateSelectionCount();
}

function updateSelectionCount() {
  if (!currentJob) return;
  const n = currentJob.claims.filter(c => c.approved && c.status === "pending").length;
  document.getElementById("selection-count").textContent = `${n} pending & approved`;
}

async function selectByConfidence(levels) {
  if (!currentJob) return;
  const approvals = {};
  currentJob.claims.forEach(c => {
    if (c.status !== "pending") return;
    approvals[c.id] = levels.includes((c.confidence || "").toLowerCase());
  });
  try {
    await api(`/jobs/${currentJob.job_id}/approve`, {
      method: "POST",
      body: JSON.stringify({ approvals }),
    });
    await loadJob(currentJob.job_id);
  } catch (e) { alert("bulk approve failed: " + e.message); }
}

async function feedLoop() {
  if (!currentJob || feedingLoop) return;
  feedingLoop = true;
  feedCancel = false;
  setJobControlsEnabled(true);
  const autoAccept = document.getElementById("feed-auto-accept").checked;
  const stats = { committed: 0, inconsistent: 0, needs_review: 0, error: 0, processed: 0 };

  // Resume in case the server thinks the job is paused
  try {
    await api(`/jobs/${currentJob.job_id}/resume`, { method: "POST" });
  } catch (e) { /* ignore */ }

  try {
    while (!feedCancel) {
      let r;
      try {
        r = await api(`/jobs/${currentJob.job_id}/feed_one`, {
          method: "POST",
          body: JSON.stringify({ auto_accept: autoAccept }),
        });
      } catch (e) {
        renderFeedProgress(stats, `feed error: ${e.message}`);
        break;
      }
      if (r.done) {
        renderFeedProgress(stats, "all pending+approved claims processed", true);
        break;
      }
      stats.processed++;
      const claim = r.claim || {};
      if (claim.status === "committed") stats.committed++;
      else if (claim.status === "inconsistent") stats.inconsistent++;
      else if (claim.status === "needs_review") stats.needs_review++;
      else if (claim.status === "error") stats.error++;

      // Periodically pull fresh job state so the UI reflects disk reality
      if (stats.processed % 5 === 0) {
        await loadJob(currentJob.job_id);
      } else {
        // Cheap local update
        const localClaim = currentJob.claims.find(c => c.id === claim.id);
        if (localClaim) Object.assign(localClaim, claim);
        renderClaims();
        renderJobSummary();
      }
      renderFeedProgress(stats, `remaining: ${r.remaining}`);
    }
  } finally {
    feedingLoop = false;
    if (feedCancel) {
      try { await api(`/jobs/${currentJob.job_id}/pause`, { method: "POST" }); } catch {}
    }
    await loadJob(currentJob.job_id);
    setJobControlsEnabled(true);
  }
}

function renderFeedProgress(stats, extra, done = false) {
  document.getElementById("feed-progress").innerHTML = `
    <div class="progress">
      processed ${stats.processed} &middot; committed ${stats.committed} &middot; inconsistent ${stats.inconsistent} &middot; needs review ${stats.needs_review} &middot; errors ${stats.error}${extra ? "<br/><span class='muted'>" + esc(extra) + "</span>" : ""}
    </div>`;
}

async function pauseFeed() {
  feedCancel = true;
}
async function resumeFeed() {
  if (feedingLoop) return;
  await feedLoop();
}

// File upload
document.getElementById("extract-file").addEventListener("change", async (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  const text = await f.text();
  document.getElementById("extract-text").value = text;
  if (!document.getElementById("extract-section").value) {
    document.getElementById("extract-section").value = f.name.replace(/\.[^.]+$/, "");
  }
  extractStatus(`loaded ${f.name} (${text.length.toLocaleString()} chars)`);
});

document.getElementById("btn-clear-text").onclick = () => {
  document.getElementById("extract-text").value = "";
  document.getElementById("extract-file").value = "";
  extractStatus("");
};

document.getElementById("btn-extract").onclick = runExtractionIntoJob;
document.getElementById("btn-feed").onclick = feedLoop;
document.getElementById("btn-pause").onclick = pauseFeed;
document.getElementById("btn-resume").onclick = resumeFeed;
document.getElementById("btn-select-high").onclick = () => selectByConfidence(["high"]);
document.getElementById("btn-select-high-med").onclick = () => selectByConfidence(["high", "medium"]);
document.getElementById("btn-select-none").onclick = () => selectByConfidence([]);
document.getElementById("btn-job-new").onclick = createJob;
document.getElementById("btn-job-delete").onclick = deleteCurrentJob;
document.getElementById("btn-job-refresh").onclick = () => refreshJobList();
document.getElementById("job-select").addEventListener("change", (ev) => loadJob(ev.target.value));

// Initial job list load when the extract tab is first shown
let _jobsInited = false;
async function initJobsOnFirstView() {
  if (_jobsInited) return;
  _jobsInited = true;
  try { await refreshJobList(); } catch (e) { console.error(e); }
}

// ---------- graph tab ----------
async function refreshGraph() {
  try {
    const [stats, classes, indivs] = await Promise.all([
      api("/graph"),
      api("/graph/classes"),
      api("/graph/individuals"),
    ]);
    document.getElementById("stats").textContent =
      `classes: ${stats.stats.num_classes}  |  individuals: ${stats.stats.num_individuals}  |  props: ${stats.stats.num_object_properties}`;

    const clsRows = classes.map(c => `
      <tr><td><code class="iri">${esc(c.iri.split("#").pop())}</code></td>
          <td>${esc(c.label)}</td>
          <td class="muted">${esc((c.parents || []).join(", "))}</td></tr>`).join("");
    const indRows = indivs.map(i => `
      <tr><td><code class="iri">${esc(i.iri.split("#").pop())}</code></td>
          <td>${esc(i.label)}</td>
          <td class="muted">${esc((i.types || []).join(", "))}</td></tr>`).join("");

    const commitRows = (stats.recent_commits || []).map(c => `
      <tr><td><code>${esc(c.hash.slice(0, 7))}</code></td>
          <td class="muted">${esc(c.time.slice(0, 16))}</td>
          <td>${esc(c.message)}</td></tr>`).join("");

    document.getElementById("tab-graph").innerHTML = `
      <h4 class="section-head">Classes</h4>
      <table><thead><tr><th>IRI</th><th>Label</th><th>Parents</th></tr></thead><tbody>${clsRows || '<tr><td colspan=3 class="muted">(none)</td></tr>'}</tbody></table>
      <h4 class="section-head">Individuals</h4>
      <table><thead><tr><th>IRI</th><th>Label</th><th>Types</th></tr></thead><tbody>${indRows || '<tr><td colspan=3 class="muted">(none)</td></tr>'}</tbody></table>
      ${commitRows ? `<h4 class="section-head">Recent Commits</h4><table><thead><tr><th>hash</th><th>time</th><th>message</th></tr></thead><tbody>${commitRows}</tbody></table>` : ""}
    `;
  } catch (e) {
    document.getElementById("stats").textContent = "error: " + e.message;
  }
}

// ---------- session log ----------
async function refreshLog() {
  try {
    const events = await api(`/session/${SESSION_ID}`);
    if (!events.length) {
      document.getElementById("tab-log").innerHTML = `<div class="muted">No events yet this session.</div>`;
      return;
    }
    document.getElementById("tab-log").innerHTML = events.map(e => `
      <details>
        <summary>${esc(e.ts.slice(11, 19))} <code>${esc(e.event_type)}</code></summary>
        <pre class="muted" style="white-space:pre-wrap; font-size:11px;">${fmt(e.payload)}</pre>
      </details>
    `).join("");
  } catch (e) {
    document.getElementById("tab-log").innerHTML = `<div class="muted">log error: ${esc(e.message)}</div>`;
  }
}

// ---------- tabs ----------
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".tab-pane").forEach(p => p.style.display = p.id === `tab-${name}` ? "" : "none");
  if (name === "graph") refreshGraph();
  if (name === "log") refreshLog();
  if (name === "extract") initJobsOnFirstView();
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => switchTab(t.dataset.tab));

// ---------- misc ----------
function setBusy(busy) {
  document.querySelectorAll("button").forEach(b => {
    if (!b.dataset.keepEnabled) b.disabled = busy;
  });
}

document.getElementById("btn-propose").onclick = propose;
document.getElementById("btn-query").onclick = query;
document.getElementById("utterance").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    propose();
  }
});

refreshGraph();
</script>
